name = "blog-chat-proxy"
main = "src/index.ts"
compatibility_date = "2025-05-15"

[vars]
# Exact-match origins allowed to call this proxy, comma-separated:
#   ALLOWED_ORIGINS = "https://www.example.com,https://nextjs.example.com"
#
# Newlines/whitespace also work as delimiters (the parser splits on
# /[,\s]+/), because pasting one origin per line into the dashboard textarea
# is the natural thing to do and used to fail SILENTLY: the whole multi-line
# value became one non-empty "origin" that matched nothing while also
# suppressing the localhost fallback, so every request 403'd.
#
# No trailing slash on any entry: the browser's `Origin` header never has one,
# so "https://example.com/" would never match. See src/index.test.ts.
#
# This is deliberately empty here: a fork must not inherit someone else's
# domain, and the worker falls back to http://localhost:4321 when it is unset.
# Set it per deployment, e.g. in the Cloudflare dashboard or with:
#   wrangler deploy --var ALLOWED_ORIGINS:"https://www.example.com"
#
# This list is NOT the security gate — `Origin` is a header the caller writes and
# curl can forge it. Turnstile (below) is what actually gates the endpoint.
ALLOWED_ORIGINS = ""

# Address the assistant gives when a reader asks how to contact the author. The
# widget's suggested questions include "How can I get in touch?", so leaving this
# empty means the assistant can only say it does not know. Set it per deployment:
#   wrangler deploy --var CONTACT_EMAIL:"you@example.com"
CONTACT_EMAIL = ""

# Secrets are never vars. Both of these are set with `wrangler secret put`:
#
#   DEEPSEEK_API_KEY     the upstream model key
#   TURNSTILE_SECRET_KEY the Turnstile secret for this hostname
#
# TURNSTILE_SECRET_KEY is what makes the proxy safe to expose, so it is required
# in production: with no secret the worker refuses every origin except
# http://localhost:4321 rather than running as an open LLM endpoint.
# Create the widget (site key + secret) under Turnstile in the dashboard.
